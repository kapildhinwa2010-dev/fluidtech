[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fluidlayer"
version = "2.4.0"
description = "A research memory layer for language models: base + bounded KV cache (the main layer), with optional mamba/ultra/combined variants and GPT-2/Qwen2 adapters"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Kapil Dhinwa" }]
keywords = [
    "llm",
    "memory",
    "long-context",
    "kv-cache",
    "bounded-kv-cache",
    "retrieval",
    "cellular-sheaves",
    "persistent-homology",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dependencies = ["numpy>=1.23,<3"]

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.5", "build"]
gpu = [
    "torch>=2.1",
    "transformers>=4.40",
    "accelerate>=0.30",
    "safetensors>=0.4",
]

[project.urls]
Homepage = "https://github.com/kapildhinwa2010-dev/fluidtech"
Repository = "https://github.com/kapildhinwa2010-dev/fluidtech"
Issues = "https://github.com/kapildhinwa2010-dev/fluidtech/issues"
Changelog = "https://github.com/kapildhinwa2010-dev/fluidtech/blob/main/docs/CHANGELOG.md"

[tool.setuptools]
packages = ["fluidlayer", "deployment", "experiments", "kv_cache", "combined"]
include-package-data = true

[tool.setuptools.package-data]
fluidlayer = ["py.typed"]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = ["error::RuntimeWarning"]

[tool.ruff]
line-length = 88
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E741", "B008"]

[tool.ruff.lint.per-file-ignores]
"experiments/*.py" = ["E402", "E501", "B007"]
"tools/*.py" = ["E501"]
"fluidlayer_single.py" = ["E501", "F401", "F821"]
"tests/test_base_kv.py" = ["E402"]
