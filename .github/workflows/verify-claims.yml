name: Verify README claims
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install base test and lint dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "numpy>=1.23,<3" cryptography pytest ruff
      - name: Run repository self-tests and unit tests
        run: |
          set -o pipefail
          python selftest.py 2>&1 | tee selftest.log
          python run_without_pytest.py 2>&1 | tee tests_numpy.log
          python test_bulletproof.py 2>&1 | tee tests_bulletproof.log
          python test_refactored_simple.py 2>&1 | tee tests_refactored.log
          python -m pytest -q tests 2>&1 | tee tests_pytest.log
      - name: Check lint
        run: ruff check fluidlayer experiments tools tests examples selftest.py run_without_pytest.py
      - name: Install CPU model dependencies for measured claims
        run: |
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install transformers
      - name: Measure base-plus-KV claims (e19)
        run: |
          python experiments/e19_base_kv.py --sha "$GITHUB_SHA" --out e19-out 2>&1 | tee e19.log
      - name: Measure layer-comparison claims (e18)
        run: |
          python experiments/e18_compare.py --sha "$GITHUB_SHA" --out e18-out 2>&1 | tee e18.log
      - name: Publish measured results to verification-results (isolated worktree)
        if: always()
        run: |
          set -e
          git config user.name "fluidtech-verification-bot"
          git config user.email "actions@github.com"
          git fetch origin verification-results
          results_dir="$(mktemp -d)"
          cleanup() {
            git worktree remove "$results_dir" --force || true
            rm -rf "$results_dir"
          }
          trap cleanup EXIT
          git worktree add --detach "$results_dir" origin/verification-results
          mkdir -p "$results_dir/results/logs" "$results_dir/results/base-kv" "$results_dir/results/comparison"
          cp -f selftest.log tests_numpy.log tests_bulletproof.log tests_refactored.log tests_pytest.log e19.log e18.log "$results_dir/results/logs/" 2>/dev/null || true
          cp -f e19-out/run.json e19-out/basekv.md "$results_dir/results/base-kv/" 2>/dev/null || true
          cp -f e18-out/run.json e18-out/comparison.md "$results_dir/results/comparison/" 2>/dev/null || true
          git -C "$results_dir" add -f results/
          if git -C "$results_dir" diff --cached --quiet; then
            echo "nothing to commit"
            exit 0
          fi
          git -C "$results_dir" commit -m "Verification run: tests + e19 base-kv + e18 comparison"
          git -C "$results_dir" push origin HEAD:verification-results
