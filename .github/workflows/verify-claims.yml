name: Verify README claims

# Codespec (.github/copilot-instructions.md): claims must be MEASURED.
# This workflow is the executor: it runs the test suites and the claim
# verification on every push to main, and publishes the measured
# results to the 'verification-results' branch.
#
# Claim measurement:
#   - tests/test_base_kv.py : the MAIN layer's own self-test
#   - experiments/e19_base_kv.py  : base+kv claims (results/base-kv/)
#   - experiments/e18_compare.py  : 5-layer comparison (results/comparison/)
#
# The publish step MERGES into verification-results (never --force):
# the e18/e19 measurements and the historical e10-e15 results live on
# that branch and must never be wiped by a force push from main's tree.
#
# It also keeps the tree lint-clean: ruff violations that can be fixed
# mechanically are fixed and committed to main inside this run.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install base deps
        run: |
          pip install "numpy>=1.23,<3" cryptography

      - name: Lint (ruff, log only)
        run: |
          pip install ruff
          set +e
          ruff check fluidlayer experiments tools tests examples selftest.py run_without_pytest.py --output-format=concise 2>&1 | tee ruff.log
          echo "ruff exit (before autofix): ${PIPESTATUS[0]}" >> ruff.log
          exit 0

      - name: Lint autofix (mechanical fixes only)
        run: |
          set +e
          for i in 1 2 3; do
            ruff check fluidlayer experiments tools tests examples selftest.py run_without_pytest.py --fix --unsafe-fixes --output-format=concise 2>&1 | tee -a ruff.log
          done
          ruff check fluidlayer experiments tools tests examples selftest.py run_without_pytest.py --output-format=concise 2>&1 | tee -a ruff.log
          echo "ruff exit (after autofix): ${PIPESTATUS[0]}" >> ruff.log
          exit 0

      - name: Commit lint fixes to main (if any) and record the verified SHA
        run: |
          git config user.name "fluidtech-verification-bot"
          git config user.email "actions@github.com"
          if ! git diff --quiet; then
            git add fluidlayer experiments tools tests examples selftest.py run_without_pytest.py
            git commit -m "style: ruff --fix --unsafe-fixes (keep the CI lint job green)"
            git push origin HEAD:main
          fi
          echo "VERIFIED_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Run repo test suites (numpy-only)
        run: |
          set +e
          python run_without_pytest.py 2>&1 | tee tests_numpy.log
          echo "run_without_pytest exit: ${PIPESTATUS[0]}" >> tests_numpy.log
          python test_bulletproof.py 2>&1 | tee tests_bulletproof.log
          echo "test_bulletproof exit: ${PIPESTATUS[0]}" >> tests_bulletproof.log
          python test_refactored_simple.py 2>&1 | tee tests_refactored.log
          echo "test_refactored exit: ${PIPESTATUS[0]}" >> tests_refactored.log
          exit 0

      - name: Install model deps (CPU torch)
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install transformers

      - name: Run claim verification (the MAIN layer self-test)
        run: |
          set +e
          python tests/test_base_kv.py 2>&1 | tee verify.log
          echo "test_base_kv exit: ${PIPESTATUS[0]}" >> verify.log
          exit 0

      - name: Run e19 (base+kv) and e18 (5-layer comparison)
        run: |
          set +e
          python experiments/e19_base_kv.py --sha "$VERIFIED_SHA" --out e19-out 2>&1 | tee e19.log
          echo "e19 exit: ${PIPESTATUS[0]}" >> e19.log
          python experiments/e18_compare.py --sha "$VERIFIED_SHA" --out e18-out 2>&1 | tee e18.log
          echo "e18 exit: ${PIPESTATUS[0]}" >> e18.log
          exit 0

      - name: Publish measured results to verification-results (merge, never force)
        run: |
          git config user.name "fluidtech-verification-bot"
          git config user.email "actions@github.com"
          git fetch origin verification-results
          git checkout -B vr origin/verification-results
          mkdir -p results/logs results/base-kv results/comparison
          cp -f tests_numpy.log tests_bulletproof.log tests_refactored.log verify.log ruff.log e19.log e18.log results/logs/ 2>/dev/null || true
          cp -f e19-out/run.json e19-out/basekv.md results/base-kv/ 2>/dev/null || true
          cp -f e18-out/run.json e18-out/comparison.md results/comparison/ 2>/dev/null || true
          git add -f results/ || true
          if git diff --cached --quiet; then
            echo "nothing to commit"
            exit 0
          fi
          git commit -m "Verification run: tests + e19 base-kv + e18 comparison"
          if ! git push origin HEAD:verification-results; then
            git fetch origin verification-results
            git -c core.editor=true pull -X theirs origin verification-results || true
            git add -f results/ || true
            git commit -m "Verification run (merged)" || true
            git push origin HEAD:verification-results
          fi
