name: pypi-release-dispatch

# Triggered: 2026-11-06 — release v2.3.0 (base+kv main layer).
# THE PyPI RELEASE BUTTON (no tag, no PAT in the repo).
# Tags cannot be created from the chat tooling, so this workflow is
# the trigger: pushing a commit that touches THIS FILE (or clicking
# "Run workflow") dispatches release.yml, which re-runs ALL the checks
# (selftest, fluidlayer_single, pytest) and only then publishes to PyPI
# with trusted publishing.
#
# Bump the version in pyproject.toml first: PyPI rejects a re-upload
# of a version that already exists.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/pypi-dispatch.yml']

permissions:
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch the release workflow
        run: |
          curl -sS -f -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/${{ github.repository }}/actions/workflows/release.yml/dispatches \
            -d '{"ref":"main"}'
      - name: Report the release run URL
        run: |
          sleep 15
          curl -sS -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/release.yml/runs?per_page=1" \
            | python3 -c 'import json,sys; r=json.load(sys.stdin)["workflow_runs"][0]; print(r["html_url"]); print(r["status"])'
