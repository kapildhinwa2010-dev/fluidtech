name: features-test

on:
  push:
    branches: [experiments]
    paths:
      - 'fluidlayer/quantization.py'
      - 'fluidlayer/multi_gpu.py'
      - 'fluidlayer/acceleration.py'
      - 'tests/test_quantization.py'
      - 'tests/test_multi_gpu.py'
      - 'tests/test_acceleration.py'
      - 'experiments/e21_features.py'
      - '.github/workflows/features-test.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  features:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout experiments
        uses: actions/checkout@v4
        with:
          ref: experiments
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps (CPU torch)
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install numpy pytest

      - name: Unit tests (3 features)
        run: |
          set -o pipefail
          python -m pytest tests/test_quantization.py tests/test_multi_gpu.py tests/test_acceleration.py -v 2>&1 | tee features-tests.log

      - name: Measure (e21)
        run: |
          set -o pipefail
          python experiments/e21_features.py --sha "${{ github.sha }}" --out e21-out 2>&1 | tee e21.log

      - name: Publish results to verification-results
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin verification-results
          git checkout -B verification-results origin/verification-results
          mkdir -p results/e21-features
          if [ -f e21-out/run.json ]; then cp -f e21-out/run.json results/e21-features/run.json; fi
          if [ -f e21-out/features.md ]; then cp -f e21-out/features.md results/e21-features/features.md; fi
          if [ -f features-tests.log ]; then cp -f features-tests.log results/e21-features/tests.log; fi
          if [ -f e21.log ]; then cp -f e21.log results/e21-features/run.log; fi
          git add -f results/e21-features
          git diff --staged --quiet || git commit -m "e21: results for commit ${{ github.sha }}"
          (git push origin verification-results) || (git pull -X theirs origin verification-results && git push origin verification-results)