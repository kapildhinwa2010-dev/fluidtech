name: deployment companion

on:
  pull_request:
    paths:
      - ".github/workflows/deployment-check.yml"
      - "deployment/**"
      - "tests/test_session_registry.py"
  push:
    branches: [main, master]
    paths:
      - ".github/workflows/deployment-check.yml"
      - "deployment/**"
      - "tests/test_session_registry.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  session-registry:
    name: session registry (python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test tools
        run: python -m pip install pytest ruff
      - name: Test lifecycle and isolation behavior
        run: python -m pytest -q tests/test_session_registry.py
      - name: Lint deployment code
        run: ruff check deployment tests/test_session_registry.py
