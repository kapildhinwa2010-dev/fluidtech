name: e20-finetune-kv

on:
  push:
    branches: [main, experiments]
    paths:
      - 'experiments/e20_finetune_kv.py'
      - '.github/workflows/e20-finetune.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  e20:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout (triggering branch)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps (CPU torch)
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install transformers peft datasets numpy

      - name: Run e20 (5 min budget)
        run: |
          set -o pipefail
          python experiments/e20_finetune_kv.py --sha "${{ github.sha }}" --out e20-out --minutes 5 2>&1 | tee e20.log

      - name: Publish results to verification-results
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin verification-results
          git checkout -B verification-results origin/verification-results
          mkdir -p results/e20-finetune
          if [ -f e20-out/run.json ]; then cp -f e20-out/run.json results/e20-finetune/run.json; fi
          if [ -f e20-out/finetune.md ]; then cp -f e20-out/finetune.md results/e20-finetune/finetune.md; fi
          if [ -f e20.log ]; then cp -f e20.log results/e20-finetune/run.log; fi
          git add -f results/e20-finetune
          git diff --staged --quiet || git commit -m "e20: results for commit ${{ github.sha }}"
          (git push origin verification-results) || (git pull -X theirs origin verification-results && git push origin verification-results)