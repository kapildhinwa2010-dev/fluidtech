name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: verify (python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install "numpy>=1.23,<3" pytest
      - name: The self-verification checks
        run: python selftest.py
      - name: The single-file bundle
        run: python fluidlayer_single.py --selftest
      - name: The unit tests
        run: python -m pytest -q tests
      - name: The bulletproof layer's own suite (numpy only)
        run: python test_bulletproof.py
      - name: The quickstart example
        run: python examples/quickstart.py
      - name: Optional backend command help
        run: |
          python experiments/e14_real_gpt2.py --help
          python experiments/e15_scale_model.py --help
          python experiments/gpu_graft.py --help

  package:
    name: the package builds and installs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install the build tools
        run: python -m pip install --upgrade pip build
      - name: Build
        run: python -m build
      - name: Install the built wheel into a clean venv
        run: |
          python -m venv /tmp/v
          /tmp/v/bin/pip install dist/*.whl
          /tmp/v/bin/python -c "import fluidlayer; print(fluidlayer.__version__)"
          /tmp/v/bin/python -c "
          from fluidlayer import SAABranch, FrozenRegister
          print('the public API imports from an installed wheel')"
          /tmp/v/bin/python -c "
          from deployment.session_registry import SessionRegistry
          print('the deployment companion imports from an installed wheel')"

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install
        run: python -m pip install ruff
      - name: ruff
        run: ruff check fluidlayer experiments tools tests examples selftest.py run_without_pytest.py

  torch-parity:
    name: optional PyTorch parity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install CPU dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "numpy>=1.23,<3" pytest
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Compare the NumPy and PyTorch implementations
        run: python -m pytest -q tests/test_torch_parity.py tests/test_qwen2_model.py
