name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify (python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install "numpy>=1.23,<3" pytest
      - name: The self-verification checks
        run: python selftest.py
      - name: The single-file bundle
        run: python superfluid_single.py --selftest
      - name: The unit tests
        run: python -m pytest -q tests
      - name: The quickstart example
        run: python examples/quickstart.py

  package:
    name: the package builds and installs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install the build tools
        run: python -m pip install --upgrade pip build
      - name: Build
        run: python -m build
      - name: Install the built wheel into a clean venv
        run: |
          python -m venv /tmp/v
          /tmp/v/bin/pip install dist/*.whl
          /tmp/v/bin/python -c "import superfluid; print(superfluid.__version__)"
          /tmp/v/bin/python -c "
          from superfluid import SAABranch, FrozenRegister
          print('the public API imports from an installed wheel')"

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: python -m pip install ruff
      - name: ruff
        run: ruff check superfluid experiments tools tests examples
