name: nightly

on:
  schedule:
    - cron: "17 3 * * *"      # 03:17 UTC
  workflow_dispatch:

jobs:
  full:
    name: the full experiment sweep (CPU)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install "numpy>=1.23,<3"
      - name: every experiment, at full size
        run: python experiments/run_all.py --full
      - name: upload the results
        uses: actions/upload-artifact@v4
        with:
          name: results
          path: results/
          if-no-files-found: warn
