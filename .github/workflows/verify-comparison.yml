name: Compare layers

# Benchmarks ALL branch layers in one identical harness (e18) and
# publishes the comparison to verification-results under
# results/comparison/ (main results are never touched).

on:
  push:
    branches: [combined-layer]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: |
          pip install "numpy>=1.23,<3" cryptography
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install transformers ruff

      - name: Lint (ruff, log only)
        run: |
          set +e
          ruff check experiments/e18_compare.py combined --line-length 100 --fix --unsafe-fixes --output-format=concise 2>&1 | tee ruff.log
          ruff check experiments/e18_compare.py combined --line-length 100 --output-format=concise 2>&1 | tee -a ruff.log
          echo "ruff exit: ${PIPESTATUS[0]}" >> ruff.log
          exit 0

      - name: Run the layer comparison
        run: |
          set +e
          python experiments/e18_compare.py --sha "$GITHUB_SHA" --out comparison-results 2>&1 | tee compare.log
          echo "e18 exit: ${PIPESTATUS[0]}" >> compare.log
          exit 0

      - name: Publish comparison to verification-results (no clobber)
        if: always()
        run: |
          git config user.name "fluidtech-verification-bot"
          git config user.email "actions@github.com"
          # stash logs outside the tree before switching branches
          mkdir -p /tmp/pub/logs
          cp -f comparison-results/* /tmp/pub/ 2>/dev/null || true
          cp -f compare.log ruff.log /tmp/pub/logs/ 2>/dev/null || true
          git checkout -- . 2>/dev/null || true
          git fetch origin verification-results
          git checkout -f -b publish origin/verification-results
          mkdir -p results/comparison/logs
          cp -f /tmp/pub/run.json /tmp/pub/comparison.md results/comparison/ 2>/dev/null || true
          cp -f /tmp/pub/logs/* results/comparison/logs/ 2>/dev/null || true
          git add results/comparison
          if git diff --cached --quiet; then
            echo "nothing to publish"
            exit 0
          fi
          git commit -m "Layer comparison run (all branches, identical harness)"
          git push origin publish:verification-results